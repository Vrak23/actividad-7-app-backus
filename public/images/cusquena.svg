<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="100" fill="#d97706" opacity="0.1"/>
  <!-- Bottle Shape -->
  <path d="M185 50 L215 50 L215 80 L235 110 L235 240 Q235 250 225 250 L175 250 Q165 250 165 240 L165 110 L185 80 Z" fill="url(#amber)"/>
  <!-- Bottle Cap -->
  <rect x="183" y="42" width="34" height="12" rx="3" fill="#f59e0b"/>

  <line x1="185" y1="88" x2="215" y2="88" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>
  <line x1="180" y1="96" x2="220" y2="96" stroke="#fef08a" stroke-width="1.5" opacity="0.6"/>
  <!-- Label -->
  <rect x="168" y="130" width="64" height="75" rx="4" fill="#18181b"/>
  <rect x="172" y="134" width="56" height="67" rx="2" stroke="#d97706" stroke-width="1.5" fill="#09090b"/>
  <text x="200" y="158" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#facc15" text-anchor="middle" letter-spacing="1">CUSQUEÑA</text>
  <text x="200" y="172" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle">DORADA</text>
  <text x="200" y="186" font-family="Arial, sans-serif" font-size="6" fill="#f59e0b" text-anchor="middle">MAESTRÍA CERVECERA</text>
  <text x="200" y="196" font-family="Arial, sans-serif" font-size="6" fill="#a1a1aa" text-anchor="middle">620 ml • Premium</text>
  <!-- Highlights -->
  <path d="M172 110 Q180 85 188 82" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
